name: wiki-pages

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "audiences/**"
      - "diagrams/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "src/**"
      - "scripts/wiki/**"
      - ".github/workflows/wiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate wiki sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source contracts
        run: npm run validate:contracts

      - name: Validate markdown inventory
        run: node scripts/wiki/validate-doc-paths.mjs

      - name: Generate wiki markdown for route validation
        run: npm run wiki:prepare

      - name: Validate internal links
        run: npm run validate:links

      - name: Validate secret safety
        run: node scripts/wiki/validate-wiki-secrets.mjs

      - name: Validate mermaid diagrams
        run: npm run validate:mermaid

  build:
    name: Build wiki pages
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Start build timer
        run: echo "WIKI_BUILD_START_SECONDS=$(date +%s)" >> $GITHUB_ENV

      - name: Build with Astro
        run: npm run build

      - name: Capture build duration
        run: |
          echo "WIKI_BUILD_DURATION_SECONDS=$(( $(date +%s) - $WIKI_BUILD_START_SECONDS ))" >> $GITHUB_ENV

      - name: Enforce wiki build budgets
        env:
          WIKI_BUILD_DURATION_SECONDS: ${{ env.WIKI_BUILD_DURATION_SECONDS }}
        run: node scripts/wiki/validate-wiki-budgets.mjs --build-duration=$WIKI_BUILD_DURATION_SECONDS

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          path: _site

  deploy:
    name: Deploy wiki pages
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d3f86a106a0bac45b974a628896c90dbdf5c8093
