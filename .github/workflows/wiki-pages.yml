name: wiki-pages

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "audiences/**"
      - "diagrams/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "playwright.config.mjs"
      - "public/**"
      - "src/**"
      - "scripts/wiki/**"
      - "tests/wiki/**"
      - ".github/workflows/wiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate wiki sources
    runs-on: ubuntu-latest
    outputs:
      validated_sha: ${{ steps.v1_ready.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test author-time draft command with mocked API
        env:
          OPENAI_API_KEY: ""
        run: npm run test:docs-prepare

      - name: Test repository secret safety
        run: npm run test:secret-safety

      - name: Test new-document scaffolding
        run: npm run test:docs-new

      - name: Test complete content contract
        run: npm run test:content-contract

      - name: Test workflow quality contract
        run: npm run test:workflow

      - name: Test Pages artifact contract
        run: npm run test:pages-artifact

      - name: Validate source contracts
        run: npm run validate:contracts

      - name: Validate markdown inventory
        run: node scripts/wiki/validate-doc-paths.mjs

      - name: Generate wiki markdown for route validation
        run: npm run wiki:prepare

      - name: Validate complete content contract
        run: npm run validate:content

      - name: Test content loading and audience routes
        run: npm run test:content-routes

      - name: Validate internal links
        run: npm run validate:links

      - name: Validate secret safety with blocked fixture
        run: npm run validate:secrets

      - name: Validate mermaid diagrams
        run: npm run validate:mermaid

      - name: Start quality build timer
        run: echo "WIKI_BUILD_START_SECONDS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build production wiki
        run: npm run build

      - name: Capture quality build duration
        run: |
          echo "WIKI_BUILD_DURATION_SECONDS=$(( $(date +%s) - WIKI_BUILD_START_SECONDS ))" >> "$GITHUB_ENV"

      - name: Enforce quality build budgets
        env:
          WIKI_BUILD_DURATION_SECONDS: ${{ env.WIKI_BUILD_DURATION_SECONDS }}
        run: node scripts/wiki/validate-wiki-budgets.mjs --build-duration="$WIKI_BUILD_DURATION_SECONDS"

      - name: Validate built wiki surfaces
        run: |
          npm run validate:inventory
          npm run validate:brand
          npm run validate:resolver
          npm run validate:source-metadata
          npm run validate:routing
          node scripts/wiki/validate-audience-routes.mjs
          npm run validate:search
          npm run validate:audience-switch
          npm run validate:article
          npm run validate:shell

      - name: Test browser journeys, accessibility, and visual baselines
        env:
          WIKI_PLAYWRIGHT_SERVER_COMMAND: npm run preview -- --host 127.0.0.1 --port 4321
        run: npm run test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-browser-failures
          path: |
            playwright-report/
            test-results/wiki/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

      - name: Mark v1-ready commit
        id: v1_ready
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build wiki pages
    if: github.event_name != 'pull_request'
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      WIKI_SITE_URL: https://wiki.nutsnews.com
      WIKI_BASE_PATH: /
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact validated commit
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          test "$GITHUB_SHA" = "$VALIDATED_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Start build timer
        run: echo "WIKI_BUILD_START_SECONDS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build with Astro
        run: npm run build

      - name: Stamp exact validated commit
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: npm run wiki:release:stamp -- --sha="$VALIDATED_SHA"

      - name: Capture build duration
        run: |
          echo "WIKI_BUILD_DURATION_SECONDS=$(( $(date +%s) - WIKI_BUILD_START_SECONDS ))" >> "$GITHUB_ENV"

      - name: Enforce wiki build budgets
        env:
          WIKI_BUILD_DURATION_SECONDS: ${{ env.WIKI_BUILD_DURATION_SECONDS }}
        run: node scripts/wiki/validate-wiki-budgets.mjs --build-duration="$WIKI_BUILD_DURATION_SECONDS"

      - name: Validate immutable Pages artifact
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: npm run validate:pages-artifact -- --sha="$VALIDATED_SHA"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy wiki pages
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
