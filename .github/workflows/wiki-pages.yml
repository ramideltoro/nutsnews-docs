name: wiki-pages

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "audiences/**"
      - "diagrams/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "src/**"
      - "scripts/wiki/**"
      - ".github/workflows/wiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate wiki sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test author-time draft command with mocked API
        env:
          OPENAI_API_KEY: ""
        run: npm run test:docs-prepare

      - name: Test human approval and freshness gate
        run: npm run test:wiki-approvals

      - name: Test new-document scaffolding
        run: npm run test:docs-new

      - name: Test complete content contract
        run: npm run test:content-contract

      - name: Validate source contracts
        run: npm run validate:contracts

      - name: Validate markdown inventory
        run: node scripts/wiki/validate-doc-paths.mjs

      - name: Generate wiki markdown for route validation
        run: npm run wiki:prepare

      - name: Validate human approval freshness
        run: node scripts/wiki/validate-wiki-approvals.mjs

      - name: Validate complete content contract
        run: npm run validate:content

      - name: Validate internal links
        run: npm run validate:links

      - name: Validate secret safety
        run: node scripts/wiki/validate-wiki-secrets.mjs

      - name: Validate mermaid diagrams
        run: npm run validate:mermaid

  build:
    name: Build wiki pages
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Start build timer
        run: echo "WIKI_BUILD_START_SECONDS=$(date +%s)" >> $GITHUB_ENV

      - name: Build with Astro
        run: npm run build

      - name: Capture build duration
        run: |
          echo "WIKI_BUILD_DURATION_SECONDS=$(( $(date +%s) - $WIKI_BUILD_START_SECONDS ))" >> $GITHUB_ENV

      - name: Enforce wiki build budgets
        env:
          WIKI_BUILD_DURATION_SECONDS: ${{ env.WIKI_BUILD_DURATION_SECONDS }}
        run: node scripts/wiki/validate-wiki-budgets.mjs --build-duration=$WIKI_BUILD_DURATION_SECONDS

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy wiki pages
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
